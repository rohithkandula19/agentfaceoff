version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentfaceoff
      POSTGRES_PASSWORD: agentfaceoff
      POSTGRES_DB: agentfaceoff
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentfaceoff"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://agentfaceoff:agentfaceoff@postgres:5432/agentfaceoff
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app   # hot-reload in dev

volumes:
  pgdata:
