substitutions:
  _TAG: latest   # overridden by trigger with $COMMIT_SHA; fine for manual builds

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/agentfaceoff-backend/backend:${_TAG}
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/agentfaceoff-backend/backend:latest
      - .
    dir: backend

  # Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [push, us-central1-docker.pkg.dev/$PROJECT_ID/agentfaceoff-backend/backend, --all-tags]

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - agentfaceoff-backend
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/agentfaceoff-backend/backend:${_TAG}
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=3600
      - --set-env-vars=APP_ENV=production,MAX_CONCURRENT_BATTLES=5,PER_IP_DAILY_LIMIT=20
      - --set-secrets=GROQ_API_KEY=groq-api-key:latest,OPENROUTER_API_KEY=openrouter-api-key:latest,TAVILY_API_KEY=tavily-api-key:latest,DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,ALLOWED_ORIGINS=allowed-origins:latest
      - --add-cloudsql-instances=$PROJECT_ID:us-central1:agentfaceoff-postgres

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/agentfaceoff-backend/backend:${_TAG}
  - us-central1-docker.pkg.dev/$PROJECT_ID/agentfaceoff-backend/backend:latest
